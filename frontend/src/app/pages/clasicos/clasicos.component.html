<div class="max-w-5xl mx-auto px-8 py-16">
  <div class="text-center mb-16">
    <h1 class="text-5xl font-serif font-bold text-texto-principal mb-4">Clásicos Literarios</h1>
    <p class="text-gray-600 italic">"Los libros que han moldeado nuestra forma de entender el mundo."</p>
  </div>

  <div class="space-y-16">
    @for (libro of clasicos; track libro.titulo) {
      <div class="flex flex-col md:flex-row gap-8 items-center border-b border-gray-200 pb-12">
        <!-- Imagen con sombra pronunciada -->
        <div class="w-full md:w-1/3">
          <img [src]="libro.imagen" [alt]="libro.titulo" class="w-full h-80 object-cover rounded shadow-2xl">
        </div>

        <!-- Texto con tipografía serif -->
        <div class="w-full md:w-2/3">
          <h2 class="text-3xl font-serif font-bold text-texto-principal mb-2">{{ libro.titulo }}</h2>
          <p class="text-lg text-verde-epigrafe font-medium mb-4">{{ libro.autor }}</p>
          <p class="text-gray-700 leading-relaxed text-lg mb-6">{{ libro.descripcion }}</p>
          <button class="border-2 border-verde-epigrafe text-verde-epigrafe px-6 py-2 hover:bg-verde-epigrafe hover:text-white transition-all font-bold">
            Leer más sobre este clásico
          </button>
        </div>
      </div>
    }
  </div>
</div>
