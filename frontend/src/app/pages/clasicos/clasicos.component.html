<div class="max-w-6xl mx-auto px-6 py-12">
  <div class="text-center mb-12">
    <h1 class="text-4xl font-serif font-bold text-texto-principal mb-2">Clásicos Literarios</h1>
    <p class="text-gray-500 italic">"Los libros que han moldeado nuestra forma de entender el mundo."</p>
  </div>

  <div class="space-y-12">
    @for (clasico of clasicos; track clasico.titulo) {
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-8 items-center">
        <div class="w-full md:w-1/3 flex justify-center">
          <img [src]="clasico.imagen" [alt]="clasico.titulo" class="h-80 object-cover rounded-2xl shadow-md">
        </div>

        <div class="w-full md:w-2/3 space-y-4">
          <h2 class="text-3xl font-serif font-bold text-texto-principal">{{ clasico.titulo }}</h2>
          <p class="text-sm font-semibold text-verde-epigrafe">{{ clasico.autor }}</p>
          <p class="text-gray-600 leading-relaxed">{{ clasico.descripcion }}</p>

          <!-- Bloque desplegable con la información extendida -->
          @if (clasico.activo) {
            <div class="p-4 bg-crema-fondo rounded-2xl border border-amber-100 text-sm text-stone-700 animate-fadeIn">
              <p class="font-semibold text-verde-epigrafe mb-1">Reseña extendida:</p>
              {{ clasico.detallesExtensos }}
            </div>
          }

          <button 
            (click)="toggleLeerMas(clasico)" 
            class="px-6 py-2.5 border-2 border-verde-epigrafe text-verde-epigrafe rounded-xl font-bold text-sm hover:bg-verde-epigrafe hover:text-white transition-colors">
            {{ clasico.activo ? 'Ocultar detalles' : 'Leer más sobre este clásico' }}
          </button>
        </div>
      </div>
    }
  </div>
</div>
