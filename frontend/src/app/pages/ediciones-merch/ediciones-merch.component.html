<div class="max-w-6xl mx-auto px-8 py-12">
  <div class="mb-10">
    <h1 class="text-4xl font-serif font-bold text-texto-principal mb-2">Ediciones Especiales y Merch</h1>
    <p class="text-gray-600">Lleva contigo la esencia de Epígrafe. Productos curados para verdaderos amantes de la lectura.</p>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    @for (item of items; track item.nombre) {
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 hover:shadow-lg transition-all duration-300 flex flex-col justify-between">
        <div>
          <div class="overflow-hidden rounded-xl mb-4">
            <img [src]="item.imagen" [alt]="item.nombre" class="w-full h-48 object-cover transform hover:scale-110 transition-transform duration-500">
          </div>
          <span class="text-[10px] font-bold text-verde-epigrafe bg-crema-fondo px-2 py-0.5 rounded-full uppercase tracking-wider">
            {{ item.categoria }}
          </span>
          <h3 class="font-bold text-texto-principal mt-2 mb-1">{{ item.nombre }}</h3>
        </div>

        <div class="flex justify-between items-center mt-4">
          <span class="text-lg font-bold text-gray-900">${{ item.precio }}</span>
          <button (click)="agregarAlCarrito(item)"
          class="bg-verde-epigrafe text-white p-2 rounded-lg hover:bg-opacity-90 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
      </div>
    }
  </div>
</div>
