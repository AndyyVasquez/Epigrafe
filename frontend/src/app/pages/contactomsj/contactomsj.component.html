<section class="max-w-xl mx-auto px-6 py-16">
  <h1 class="text-3xl font-bold text-verde-epigrafe mb-2">Escríbenos</h1>
  <p class="text-gray-600 mb-8">
    ¿Dudas, sugerencias o algo que quieras contarnos? Este formulario llega
    directo a nuestro equipo.
  </p>

  @if (estado === 'exito') {
    <!-- Estado: éxito. Reemplaza el formulario, no lo oculta con CSS. -->
    <div class="bg-green-50 border border-green-200 text-green-800 rounded-lg p-6 text-center">
      <p class="font-semibold mb-1">¡Mensaje enviado!</p>
      <p class="text-sm">Gracias por escribirnos, te responderemos pronto.</p>
      <button (click)="reintentar()" class="mt-4 text-sm underline text-verde-epigrafe">
        Enviar otro mensaje
      </button>
    </div>
  } @else {
    <form #contactoForm="ngForm" (ngSubmit)="enviarMensaje(contactoForm)" novalidate>
      <div class="mb-4">
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          [(ngModel)]="form.nombre"
          required
          maxlength="100"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde-epigrafe"
        />
      </div>

      <div class="mb-4">
        <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo</label>
        <input
          id="correo"
          name="correo"
          type="email"
          [(ngModel)]="form.correo"
          required
          email
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde-epigrafe"
        />
      </div>

      <div class="mb-4">
        <label for="asunto" class="block text-sm font-medium text-gray-700 mb-1">Asunto</label>
        <input
          id="asunto"
          name="asunto"
          type="text"
          [(ngModel)]="form.asunto"
          required
          maxlength="150"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde-epigrafe"
        />
      </div>

      <div class="mb-6">
        <label for="mensaje" class="block text-sm font-medium text-gray-700 mb-1">Mensaje</label>
        <textarea
          id="mensaje"
          name="mensaje"
          rows="4"
          [(ngModel)]="form.mensaje"
          required
          maxlength="2000"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde-epigrafe"
        ></textarea>
      </div>

      @if (estado === 'error') {
        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-md px-4 py-3">
          {{ mensajeError }}
        </div>
      }

      <button
        type="submit"
        [disabled]="estado === 'enviando'"
        class="w-full bg-verde-epigrafe text-white rounded-md py-2.5 font-medium hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        @if (estado === 'enviando') {
          <span class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          Enviando...
        } @else {
          Enviar mensaje
        }
      </button>
    </form>
  }
</section>
