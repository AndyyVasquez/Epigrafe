<div class="max-w-6xl mx-auto px-8 py-12">
  <h1 class="text-4xl font-serif font-bold text-texto-principal mb-8">Nuestra Librería</h1>

  <!-- Barra de Búsqueda General -->
  <div class="mb-8">
    <input 
      type="text" 
      [(ngModel)]="terminoBusqueda" 
      placeholder="Buscar libro por título o autor..." 
      class="w-full md:w-96 px-4 py-3 rounded-xl border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-verde-epigrafe bg-white">
  </div>

  <div class="flex flex-col md:flex-row gap-10">

    <!-- Sidebar de Filtros -->
    <aside class="w-full md:w-64 space-y-6">
      <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
        <h3 class="font-bold text-verde-epigrafe mb-4 uppercase tracking-wider text-sm">Categorías</h3>
        <ul class="space-y-2 text-gray-600">
          <li>
            <button (click)="filtroCategoria = 'todos'" [class.font-bold]="filtroCategoria === 'todos'" class="hover:text-verde-epigrafe transition-colors w-full text-left">
              Todos los libros
            </button>
          </li>
          <li>
            <button (click)="filtroCategoria = 'Clásicos'" [class.font-bold]="filtroCategoria === 'Clásicos'" class="hover:text-verde-epigrafe transition-colors w-full text-left">
              Clásicos
            </button>
          </li>
          <li>
            <button (click)="filtroCategoria = 'Romance'" [class.font-bold]="filtroCategoria === 'Romance'" class="hover:text-verde-epigrafe transition-colors w-full text-left">
              Romance
            </button>
          </li>
          <li>
            <button (click)="filtroCategoria = 'Misterio'" [class.font-bold]="filtroCategoria === 'Misterio'" class="hover:text-verde-epigrafe transition-colors w-full text-left">
              Misterio
            </button>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Catálogo -->
    <main class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  @for (libro of librosFiltrados; track libro.id) {
    <div class="bg-white p-5 border rounded-2xl shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
      <div>
        <div class="relative overflow-hidden rounded-xl mb-4 h-64 bg-gray-50 flex items-center justify-center">
          <img [src]="libro.imagen || '/img/default.jpg'" [alt]="libro.titulo" class="w-full h-full object-cover">
        </div>
        <span class="text-[10px] uppercase font-bold px-2 py-0.5 bg-crema-fondo text-verde-epigrafe rounded-full">{{ libro.tipo_etiqueta || libro.categoria }}</span>
        <h3 class="font-serif font-bold text-lg mt-2 text-stone-800">{{ libro.titulo }}</h3>
        <p class="text-xs text-gray-500 mb-2">Por: {{ libro.autor }}</p>
        <p class="text-sm font-bold text-verde-epigrafe mb-4">${{ libro.precio }} MXN</p>
      </div>

      <button (click)="comprarParaPickup(libro)" class="w-full bg-verde-epigrafe text-crema-fondo py-2.5 rounded-xl font-bold text-sm hover:opacity-95 transition-colors">
        Apartar para Pickup
      </button>
    </div>
  } @empty {
    <p class="text-gray-500 italic col-span-full text-center py-12">No se encontraron libros que coincidan con tu búsqueda.</p>
  }
</div>
    </main>
  </div>
</div>
