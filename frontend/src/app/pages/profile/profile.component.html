<div class="max-w-xl mx-auto px-6 py-16">
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
    <h1 class="text-3xl font-serif font-bold text-verde-epigrafe mb-2">Mi Perfil y Seguridad</h1>
    <p class="text-gray-600 text-sm mb-6">Gestiona la seguridad de tu cuenta y actualiza tu contraseña de acceso.</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Contraseña Actual</label>
        <input 
          type="password" 
          [(ngModel)]="passwordActual" 
          placeholder="••••••••" 
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-verde-epigrafe focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nueva Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="nuevoPassword" 
          placeholder="••••••••" 
          class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-verde-epigrafe focus:outline-none">
      </div>

      <button 
        (click)="cambiarPassword()" 
        class="w-full bg-verde-epigrafe text-crema-fondo py-3 rounded-xl font-bold text-sm hover:opacity-95 transition-colors shadow-md mt-4">
        Actualizar Contraseña
      </button>
    </div>
  </div>
</div>
