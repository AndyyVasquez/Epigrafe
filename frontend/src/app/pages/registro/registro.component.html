<div class="max-w-2xl mx-auto py-16 px-8">
  <h1 class="text-4xl font-serif font-bold text-center text-texto-principal mb-2">Únete a Epígrafe</h1>
  <p class="text-center text-gray-600 mb-10">Crea tu cuenta y empieza a disfrutar de tus beneficios.</p>

  <form (submit)="registrarUsuario()" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium mb-1">Nombre</label>
        <input [(ngModel)]="usuario.nombre" name="nombre" required class="w-full p-3 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Apellidos</label>
        <input [(ngModel)]="usuario.apellidos" name="apellidos" required class="w-full p-3 border rounded-lg">
      </div>
    </div>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-1">Correo electrónico</label>
      <input [(ngModel)]="usuario.correo" name="correo" type="email" required pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Introduce un correo válido con @, por ejemplo: correo@gmail.com" class="w-full p-3 border rounded-lg" placeholder="correo@ejemplo.com">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <div>
        <label class="block text-sm font-medium mb-1">Contraseña</label>
        <input [(ngModel)]="usuario.password" name="password" type="password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[a-zA-Z\d!@#$%^&*]{9,}$" title="La contraseña debe tener al menos 9 caracteres, incluir una mayúscula, una minúscula, un número y un carácter especial (!@#$%^&*)" class="w-full p-3 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Teléfono</label>
        <input [(ngModel)]="usuario.telefono" name="telefono" type="tel" inputmode="numeric" pattern="^\d{10}$" minlength="10" maxlength="10" title="Introduce un teléfono exacto de 10 dígitos numéricos" class="w-full p-3 border rounded-lg">
      </div>
    </div>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-1">Género</label>
      <select [(ngModel)]="usuario.genero" name="genero" class="w-full p-3 border rounded-lg">
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="mt-6">
      <label class="block text-sm font-medium mb-1">¿Qué más te gusta leer?</label>
      <textarea [(ngModel)]="usuario.gusto_literario" name="gusto" class="w-full p-3 border rounded-lg"></textarea>
    </div>

    <button type="submit" class="w-full mt-8 bg-verde-epigrafe text-white py-4 rounded-xl font-bold text-lg hover:opacity-90 transition-all">
      Completar mi registro
    </button>
  </form>
</div>
