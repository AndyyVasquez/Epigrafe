<div class="max-w-6xl mx-auto px-8 py-12">
  <h1 class="text-4xl font-serif font-bold text-texto-principal mb-8">Administrar Catálogo</h1>

  <div class="bg-gray-50 p-6 rounded-2xl mb-12 border border-gray-200">
    <h2 class="font-bold mb-4">Agregar nuevo libro</h2>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <input [(ngModel)]="nuevoLibro.titulo" placeholder="Título" class="p-2 border rounded">
      <input [(ngModel)]="nuevoLibro.autor" placeholder="Autor" class="p-2 border rounded">
      <input [(ngModel)]="nuevoLibro.precio" placeholder="Precio" type="number" class="p-2 border rounded">
      <button (click)="agregarLibro()" class="bg-verde-epigrafe text-white rounded font-bold">Guardar</button>
    </div>
  </div>

  <!-- Catálogo Editable -->
  <main class="grid grid-cols-1 md:grid-cols-3 gap-8">
    @for (libro of catalogo; track libro.titulo) {
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <img [src]="libro.imagen" class="w-full h-48 object-cover rounded-lg mb-4">
        <h3 class="font-bold text-lg">{{ libro.titulo }}</h3>
        <p class="text-sm text-gray-600 mb-4">{{ libro.autor }} - ${{ libro.precio }}</p>

        <div class="flex gap-2">
          <button (click)="editarLibro(libro)" class="flex-1 bg-blue-100 text-blue-600 py-2 rounded text-sm font-bold">Editar</button>
          <button (click)="eliminarLibro(libro)" class="flex-1 bg-red-100 text-red-600 py-2 rounded text-sm font-bold">Eliminar</button>
        </div>
      </div>
    }
  </main>
</div>
